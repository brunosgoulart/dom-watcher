# Version: 1.5 | Date: 15/10/2026
# Changes: Replaced empty server tags with a seven-server configuration reference and explicit input/output point mapping.
piServer = ""
piAdapter = "af-sdk"
piAfSdkDll = "C:\\Program Files (x86)\\PIPC\\AF\\PublicAssemblies\\4.0\\OSIsoft.AFSDK.dll"
pollSeconds = 30
staleSeconds = 120
enableWrites = false
outputHeartbeatSeconds = 60
writeRetrySeconds = 30

[trend]
measurementSeconds = 60
# Window durations are seconds, in multiples of the 60-second measurement cadence.
windowSeconds = 600
referenceSeconds = 1800
memoryWindowSeconds = 900
criticalScore = 6.0
recoverySamples = 3

[trend.resolution]
runCPU = 0.1
runMemory = 0.1
runPVT = 1024.0
runErrorsPerMinute = 0.1
runLocalPending = 1.0
runRemotePending = 1.0

[[servers]]
id = "e3-sp-01"
name = "E3-SP-01"
site = "São Paulo"
environment = "Produção"
role = "Supervisão principal"

