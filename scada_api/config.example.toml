# Version: 1.4 | Date: 14/10/2026
# Changes: Added explicit adapter selection for AF SDK read-only validation and COM compatibility, while keeping writes disabled by default.
piServer = ""
piAdapter = "pi-sdk-com"
piAfSdkDll = "C:\\Program Files (x86)\\PIPC\\AF\\PublicAssemblies\\4.0\\OSIsoft.AFSDK.dll"
pollSeconds = 30
staleSeconds = 120
enableWrites = false
outputHeartbeatSeconds = 60
writeRetrySeconds = 30

[trend]
measurementSeconds = 60
# Window durations are seconds, in multiples of the 60-second measurement cadence.
windowSeconds = 600
referenceSeconds = 1800
memoryWindowSeconds = 900
criticalScore = 6.0
recoverySamples = 3

[trend.resolution]
runCPU = 0.1
runMemory = 0.1
runPVT = 1024.0
runErrorsPerMinute = 0.1
runLocalPending = 1.0
runRemotePending = 1.0

[[servers]]
id = "e3-sp-01"
name = "E3-SP-01"
site = "São Paulo"
environment = "Produção"
role = "Supervisão principal"
tags = {}

[servers.outputs]
runCPU = "CSEO.E3-SP-01.SCADA.Trend.CPU.State"
runMemory = "CSEO.E3-SP-01.SCADA.Trend.RAM.State"
runPVT = "CSEO.E3-SP-01.SCADA.Trend.PrivateMemory.State"
runErrorsPerMinute = "CSEO.E3-SP-01.SCADA.Trend.ScriptErrors.State"
runLocalPending = "CSEO.E3-SP-01.SCADA.Trend.LocalQueue.State"
runRemotePending = "CSEO.E3-SP-01.SCADA.Trend.RemoteQueue.State"

