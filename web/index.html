<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Monitor operacional de runtime SCADA">
  <title>Runtime Orbit — Monitor SCADA</title>
  <link rel="stylesheet" href="styles.css?v=1">
  <link rel="stylesheet" href="trend.css?v=1">
  <script src="pi-config.js?v=1" defer></script>
  <script src="app.js?v=1" defer></script>
</head>
<body>
  <main class="wallboard" aria-live="polite">
    <header class="masthead">
      <div class="brand"><span class="brand-mark" aria-hidden="true">◌</span><div><span>RUNTIME ORBIT</span><strong>Monitor SCADA</strong></div></div>
      <div class="headline" id="headline"><span class="headline-dot"></span><strong>Aguardando telemetria</strong><small>Conectando ao monitor operacional</small></div>
      <div class="masthead-actions"><time id="clock"></time><button id="motion-toggle" type="button" aria-pressed="false">Pausar órbita</button></div>
    </header>

    <section class="orbit-shell" aria-labelledby="orbit-title">
      <div class="orbit-heading"><div><span>VISÃO OPERACIONAL</span><h1 id="orbit-title">Monitor das Aplicações SCADA</h1></div><p id="orbit-context">Aguardando dados válidos</p></div>
      <div class="orbit-workspace" id="orbit-workspace" data-motion="active">
        <div class="orbit-halo halo-one" aria-hidden="true"></div><div class="orbit-halo halo-two" aria-hidden="true"></div>
        <div class="orbit-bubbles" id="orbit-bubbles" aria-label="Métricas em órbita"></div>
        <article class="focus-card" id="focus-card"><span class="focus-label">MÉTRICA EM FOCO</span><h2>—</h2><strong>—</strong><p>Estado não confirmado</p></article>
      </div>
    </section>

    <section class="trend-panel" aria-labelledby="trend-title">
      <header><div><span>TENDÊNCIA OBSERVADA</span><h2 id="trend-title">Métrica em foco</h2></div><p id="trend-context">Aguardando série temporal</p></header>
      <div class="trend-plot"><svg id="trend-chart" viewBox="0 0 760 240" role="img" aria-label="Gráfico de tendência das últimas quatro horas"></svg></div>
    </section>
    <footer><span id="api-state">Conectando à API...</span><span id="updated-state">—</span></footer>
  </main>
</body>
</html>
