# Engineering verification without PI access or deployment.
name: Engineering checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python verification
        run: python -B -m unittest discover -s tests/python -p 'test_*.py' -v
      - name: Frontend verification
        run: node --test tests/web/test-*.cjs
      - name: JavaScript syntax
        run: |
          for file in web/*.js; do node --check "$file" || exit 1; done
